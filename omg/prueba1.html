        <h1><p align="center">Login</p></h1>

    <br>

        <form action="login" method="POST">

            <label for="username"><h2> Nombre de usuario:</h2></label>

        </form>
        <div class="forgot-password">
         <h2><p><a href="/forgot-password">¿Olvidaste tu contraseña?</a></p></h2>
        </div>
    </div>
